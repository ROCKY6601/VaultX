name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create signing key
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        run: |
          # Agar zip file hi upload hui hai to usse khud extract kar lo
          if [ -z "$(find . -maxdepth 4 -name settings.gradle.kts -not -path './.git/*' | head -1)" ]; then
            ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -1)
            if [ -n "$ZIP" ]; then
              echo "Extracting $ZIP"
              mkdir -p /tmp/proj && unzip -q -o "$ZIP" -d /tmp/proj
              cp -r /tmp/proj/. ./
            fi
          fi
          SETTINGS=$(find . -maxdepth 4 -name "settings.gradle.kts" -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts nahi mili. Repo mein ye files upload karo:"
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project folder: $DIR"
          cd "$DIR"
          gradle assembleRelease --no-daemon --stacktrace
          echo "APK_DIR=$PWD" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: VaultX-apk
          path: ${{ env.APK_DIR }}/app/build/outputs/apk/release/*.apk
